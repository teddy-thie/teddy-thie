<body>

<div class="concept">
  <a class="concept__home" href="/">tedthie.cc</a>
  <a class="concept__home" href="/fun#labs">More from the Lab</a>
  <p class="concept__label"><strong>Hesabu</strong> <span>Personal concept, not CBK work.<span class="concept__more"> The figures are the Central Bank of Kenya&rsquo;s own table; the answers are worked out from it by fixed rules, not a live AI model.</span></span></p>
  <div class="concept__view" role="group" aria-label="Show">
    <span class="concept__view-label">Show</span>
    <button type="button" data-view="app" aria-pressed="true">The app</button>
    <button type="button" data-view="plan" aria-pressed="false">Event plan</button>
  </div>
  <button type="button" class="concept__reset" data-reset>Reset demo</button>
</div>

<div class="hb" id="app">
  <aside class="side" id="side" aria-label="Hesabu">
    <button type="button" class="logo" data-new aria-label="Hesabu, start a new question"></button>
    <button type="button" class="btn btn--new" data-new></button>
    <p class="caps">Dataset</p>
    <div id="dataset"></div>
    <nav class="recent" id="recent" aria-label="Recent questions"></nav>
  </aside>

  <main class="main" id="main">
    <div class="mhead">
      <button type="button" class="logo" data-new aria-label="Hesabu, start a new question"></button>
      <span class="avatar"><img src="avatar.png" alt="Wanjiku"></span>
    </div>
    <div class="actions">
      <button type="button" class="btn" data-share></button>
      <span class="avatar"><img src="avatar.png" alt="Wanjiku"></span>
    </div>
    <div class="scroll" id="scroll">
      <div id="view"><noscript><p class="col" style="padding-top:96px">This concept needs JavaScript to run.</p></noscript></div>
    </div>
    <div class="dock" id="dock" hidden></div>
    <div class="drawer-wrap" id="drawer" hidden></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <section class="plan" id="plan" hidden aria-labelledby="plan-title"></section>
</div>
